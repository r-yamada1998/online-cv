career-profile:
  title: Career Profile
  summary: |
    I am Rin Yamada, a project Assistant Professor at Nobeyama Radio Observatory, 
    which is a branch of National Astronomical Observatory of Japan. I am specialized in
    star formation, ISM evolution, and local group galaxies as well as controlling software 
    development for radio telescopes. I have completed my Ph.D. in Nagoya University, under the 
    co-supervision of Prof. Fukui and Prof. Tachihara. 

